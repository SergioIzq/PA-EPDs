<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Cuadrado Mágico</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css_ej3.css"/>
        <script src="script_ej3.js" defer></script>

    </head>
    <body>
        <header>
            <h1>Cuadrado mágico tete</h1>
            <p>Tiempo: <time class="elemento" id="crono">--</time></p>
        </header>
        <main>
            <div id="elementos">
                <span class="elemento" id="celdasRestantes">Celdas restantes:</span>
                <span class="elemento" id="sumaObjetivo">Suma objetivo: 12</span>
                <span class="elemento" id="intentos">Intentos restantes: 3</span>
            </div>
            <div id="tablero">
                <table id="tabla">
                    <tr>
                        <td class="celda" id="0-0"></td>
                        <td class="celda" id="0-1"></td>
                        <td class="celda" id="0-2"></td>
                    </tr>
                    <tr>
                        <td class="celda" id="1-0"></td>
                        <td class="celda" id="1-1"></td>
                        <td class="celda" id="1-2"></td>
                    </tr>
                    <tr>
                        <td class="celda" id="2-0"></td>
                        <td class="celda" id="2-1"></td>
                        <td class="celda" id="2-2"></td>
                    </tr>
                </table>
            </div>
            <div id="mensajes">
                <h2>Mensajes</h2>
            </div>
            <div id="info">
                <h2>Instrucciones</h2>
            </div>
            <div id="botones">
                <button type="button" id="nuevaPartida">Nueva partida</button>
                <button type="button" id="resolver">Resolver</button>
            </div>
        </main>
    </body>
</html>
