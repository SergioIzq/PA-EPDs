<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gimnasio &ndash; Gestor de actividades</title>
        <style>
            *, *::before, *::after { box-sizing: border-box; }

            body {
                max-width: 760px;
                margin: 0 auto;
                font-family: Georgia, serif;
                line-height: 1.6;
                color: #222;
                background: #f4f1ea;
            }

            body > header {
                background: #1d3557;
                color: #fff;
                padding: 1rem 1.5rem;
                border-bottom: 6px solid #e9c46a;
            }
            body > header h1 { margin: 0; color: #e9c46a; }
            body > header p  { margin: .25rem 0 0; }

            main { padding: 1.5rem; }
            h2   { color: #1d3557; border-bottom: 2px solid #e9c46a; padding-bottom: .2rem; }

            #lista { padding-left: 1.5rem; }
            #lista li { margin-bottom: .2rem; }
            #lista li.completa { color: #8b1e1e; }   /* actividad sin plazas */

            #mensaje { padding: .6rem 1rem; border-left: 5px solid #1d3557; background: #dde6f0; }
            #mensaje:empty { display: none; }
            #mensaje.ok    { border-color: #1b5e20; background: #e8f5e9; color: #1b5e20; }
            #mensaje.error { border-color: #8b1e1e; background: #fbeaea; color: #8b1e1e; }

            button {
                padding: .5rem 1.2rem;
                font: inherit;
                color: #fff;
                background: #1d3557;
                border: 0;
                border-radius: 4px;
                cursor: pointer;
            }
            button:hover:enabled { background: #3d5a80; }
            button:disabled      { background: #8a97a8; cursor: default; }
        </style>
    </head>
    <body>
        <header>
            <h1>Gestor de actividades</h1>
            <p>Gimnasio &rsaquo; Reservas y plazas</p>
        </header>

        <main>
            <section>
                <h2 id="titulo-lista">Actividades disponibles:</h2>
                <ul id="lista"></ul>
                <p id="mensaje" role="status" aria-live="polite"></p>
                <button id="iniciar" type="button">Abrir el men&uacute;</button>
            </section>
        </main>

        <script type="text/javascript" src="ej5.js"></script>
    </body>
</html>
