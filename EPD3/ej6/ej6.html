<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gimnasio &ndash; Verificaci&oacute;n de reservas por QR</title>
        <style>
            *, *::before, *::after { box-sizing: border-box; }

            body {
                max-width: 860px;
                margin: 0 auto;
                font-family: Georgia, serif;
                line-height: 1.6;
                color: #222;
                background: #f4f1ea;
            }

            body > header {
                background: #1d3557;
                color: #fff;
                padding: 1rem 1.5rem;
                border-bottom: 6px solid #e9c46a;
            }
            body > header h1 { margin: 0; color: #e9c46a; }
            body > header p  { margin: .25rem 0 0; }

            main { padding: 1.5rem; }
            h2   { color: #1d3557; border-bottom: 2px solid #e9c46a; padding-bottom: .2rem; }

            #url-leida { word-break: break-all; }   /* una URL larga no desborda la página */
            #estado:empty { display: none; }

            .tabla-contenedor { overflow-x: auto; }
            table  { width: 100%; border-collapse: collapse; background: #fff; }
            caption { text-align: left; font-weight: bold; padding-bottom: .4rem; }
            th, td { padding: .5rem .75rem; border: 1px solid #1d3557; text-align: left; }
            thead th { background: #1d3557; color: #fff; }
            td.correcta   { color: #1b5e20; }
            td.incorrecta { color: #8b1e1e; }
            tr.total td   { font-weight: bold; background: #dde6f0; }
            tr.total td.correcta   { background: #e8f5e9; }
            tr.total td.incorrecta { background: #fbeaea; }

            button {
                padding: .5rem 1.2rem;
                font: inherit;
                color: #fff;
                background: #1d3557;
                border: 0;
                border-radius: 4px;
                cursor: pointer;
            }
            button:hover { background: #3d5a80; }
        </style>
    </head>
    <body>
        <header>
            <h1>Verificaci&oacute;n de reservas</h1>
            <p>Gimnasio &rsaquo; Lectura de c&oacute;digos QR</p>
        </header>

        <main>
            <section>
                <h2>C&oacute;digo escaneado</h2>
                <p><button id="escanear" type="button">Escanear c&oacute;digo QR</button></p>
                <p id="estado" role="status" aria-live="polite"></p>
                <p>URL le&iacute;da: <code id="url-leida">(ninguna)</code></p>
            </section>

            <section>
                <h2>Resultado del an&aacute;lisis</h2>
                <div class="tabla-contenedor">
                    <table>
                        <caption>Par&aacute;metros de la reserva</caption>
                        <thead>
                            <tr>
                                <th scope="col">Par&aacute;metro</th>
                                <th scope="col">Valor</th>
                                <th scope="col">Validaci&oacute;n</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpo"></tbody>
                    </table>
                </div>
            </section>
        </main>

        <script type="text/javascript" src="ej6.js"></script>
    </body>
</html>
