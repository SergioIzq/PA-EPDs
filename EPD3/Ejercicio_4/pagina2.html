<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 4 - Sorteo de plaza</title>
</head>
<body>
    <h1>Sorteo de una plaza gratuita</h1>
    <p>Introduzca los nombres de los inscritos separados por comas. Los nombres repetidos solo participan una vez.</p>
    <textarea id="inscritos" rows="5" cols="50">Ana, Luis, Marta, Ana, Pedro, Luis</textarea>
    <br>
    <button type="button" id="sortear">Sortear</button>
    <p id="participantes"></p>
    <p id="ganador"></p>
    <p>
        Snippets utilizados:
        <a href="https://css-tricks.com/snippets/javascript/remove-duplicates-from-an-array/">Remove Duplicates from an Array</a>
        y <a href="https://css-tricks.com/snippets/javascript/select-random-item-array/">Select Random Item from an Array</a>
        (CSS-Tricks).
    </p>
    <script type="text/javascript" src="pagina2.js"></script>
</body>
</html>
