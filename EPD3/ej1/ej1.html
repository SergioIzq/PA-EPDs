<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Informe de calificaciones</title>
        <style>
            *, *::before, *::after { box-sizing: border-box; }

            body {
                max-width: 760px;
                margin: 0 auto;
                font-family: Georgia, serif;
                line-height: 1.6;
                color: #222;
                background: #f4f1ea;
            }

            body > header {
                background: #1d3557;
                color: #fff;
                padding: 1rem 1.5rem;
                border-bottom: 6px solid #e9c46a;
            }
            body > header h1 { margin: 0; color: #e9c46a; }
            body > header p  { margin: .25rem 0 0; }

            main { padding: 1.5rem; }
            h2   { color: #1d3557; border-bottom: 2px solid #e9c46a; padding-bottom: .2rem; }

            #estado { padding: .6rem 1rem; border-left: 5px solid #8b1e1e; background: #fbeaea; color: #8b1e1e; }
            #estado:empty { display: none; }

            pre#salida {
                padding: 1rem;
                overflow-x: auto;
                background: #fff;
                border: 1px solid #1d3557;
                font-family: "Courier New", monospace;
            }
            pre#salida:empty { display: none; }

            button {
                padding: .5rem 1.2rem;
                font: inherit;
                color: #fff;
                background: #1d3557;
                border: 0;
                border-radius: 4px;
                cursor: pointer;
            }
            button:hover { background: #3d5a80; }
        </style>
    </head>
    <body>
        <header>
            <h1>Informe de calificaciones</h1>
            <p>Estad&iacute;stica del rendimiento de la clase</p>
        </header>

        <main>
            <p><button id="iniciar" type="button">Registrar calificaciones</button></p>
            <p id="estado" role="alert"></p>
            <pre id="salida" aria-live="polite"></pre>
        </main>

        <script type="text/javascript" src="ej1.js"></script>
    </body>
</html>
