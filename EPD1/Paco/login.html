<!DOCTYPE html>
<html>
    <head>
        <title>Login</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <center>
            
            <img height="400" width="400" src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fimg.freepik.com%2Ffotos-premium%2Filustracion-estilo-vectorial-plano-grupo-diverso-personas-hablando-colaborando_941097-84408.jpg&f=1&nofb=1&ipt=6d9e7ee59b6c01c72d2046873bbab604f68ee9ede5caeb81a764722062da3265" alt="Foto logo"/>
            <form>
                <label for="usuario">Usuario:</label><br>
                <input type="text" id="usuario" name="usuario" placeholder="Usuario" required minlength="3" maxlength="20"><br>
                
                <label for="pswd">Contraseña:</label><br>
                <input type="password" id="pswd" name="pswd" placeholder="Contraseña" required minlength="8"><br>
                
                <a href="./index.html">
                    <input type="submit" value="Enviar">
                </a>
            </form>
        </center>
    </body>
</html>
