<!DOCTYPE html>
<html>
    <head>
        <title>Login</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <header>
            <h1>Acceso al Portal UPO</h1>
            <p>Identificación de usuarios para la gestión de servicios universitarios.</p>
        </header>

        <table>
            <tr>
                <td>
                    <nav>
                        <p><strong>Navegación:</strong></p>
                        <ul>
                            <li><a href="index.html">Volver a Inicio</a></li>
                        </ul>
                    </nav>
                </td>
                <!-- Celdas vacías para crear distancia de separación  -->                <td></td>
                <td></td>              
                <td>
                    <figure>
                        <a href="Imagenes/logo.png" target="_blank">
                            <img src="Imagenes/logo.png" alt="Acceso UPO" width="180" />
                        </a>
                        <figcaption>Universidad UPO</figcaption>
                    </figure>
                </td>
            </tr>
        </table>

        <main>
            <article>
                <section>
                    <h2>Iniciar Sesión</h2>
                    <p>Introduzca sus credenciales institucionales para acceder a su espacio personal.</p>

                    <form action="#" method="post">
                        <p>
                            <label for="usuario">Usuario / Correo institucional:</label><br>
                            <input type="text" id="usuario" name="usuario" placeholder="usuario@alu.upo.es" required>
                        </p>
                        <p>
                            <label for="password">Contraseña:</label><br>
                            <input type="password" id="password" name="password" required>
                        </p>
                        <p>
                            <input type="submit" value="Acceder">
                            <input type="reset" value="Limpiar">
                        </p>
                    </form>
                </section>
            </article>
        </main>

        <footer>
            <p>&copy; 2026 Pablo de Olavide - Portal de Ponencias y Empleo. </p>
        </footer>
    </body>
</html>
