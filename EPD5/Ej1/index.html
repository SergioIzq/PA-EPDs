<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ej1 - Semáforo con jQuery</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <h1>Semáforo de tráfico</h1>
        <p>Controla las luces desde el panel</p>
    </header>

    <main>
        <section class="semaforo" aria-label="Semáforo">
            <div class="luz roja" data-luz="roja" aria-label="Luz roja"></div>
            <div class="luz amarilla" data-luz="amarilla" aria-label="Luz amarilla"></div>
            <div class="luz verde" data-luz="verde" aria-label="Luz verde"></div>
        </section>

        <section class="panel-control" aria-label="Panel de control">
            <h2>Panel de control</h2>
            <div class="botones">
                <button type="button" class="boton roja" data-luz="roja">Rojo</button>
                <button type="button" class="boton amarilla" data-luz="amarilla">Amarillo</button>
                <button type="button" class="boton verde" data-luz="verde">Verde</button>
            </div>
        </section>

        <section class="estado" aria-label="Estado del tráfico">
            <p id="mensaje" aria-live="polite"></p>
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="js/semaforo.js"></script>
</body>
</html>
