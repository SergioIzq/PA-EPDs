<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de entradas</title>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.2/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="estilos.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.14.2/jquery-ui.min.js"></script>
    <script src="script.js"></script>
</head>
<body>
    <header>
        <h1>Festival de música</h1>
        <p>Reserva de entradas</p>
    </header>

    <main>
        <section id="formulario-reserva">
            <h2>Datos de la reserva</h2>
            <form id="form-reserva" novalidate>
                <div class="campo">
                    <label for="nombre">Nombre y apellidos</label>
                    <input type="text" id="nombre">
                    <div class="error" id="error-nombre"></div>
                </div>

                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="nombre@correo.com">
                    <div class="error" id="error-email"></div>
                </div>

                <div class="campo">
                    <label for="entradas">Número de entradas</label>
                    <input type="number" id="entradas" min="1" max="5">
                    <div class="error" id="error-entradas"></div>
                </div>

                <div class="campo">
                    <label for="fecha">Fecha de asistencia</label>
                    <input type="text" id="fecha" placeholder="dd/mm/aaaa" autocomplete="off">
                    <div class="error" id="error-fecha"></div>
                </div>

                <div class="campo">
                    <label for="tipo">Tipo de entrada</label>
                    <select id="tipo">
                        <option value="" selected>Selecciona un tipo de entrada</option>
                        <option value="general">General</option>
                        <option value="premium">Premium</option>
                        <option value="estudiante">Estudiante</option>
                    </select>
                    <div class="error" id="error-tipo"></div>
                </div>

                <div class="campo">
                    <input type="checkbox" id="condiciones">
                    <label for="condiciones">Acepto las condiciones de la reserva</label>
                    <div class="error" id="error-condiciones"></div>
                </div>

                <button type="submit">Confirmar reserva</button>
            </form>
        </section>

        <section id="panel-resumen">
            <h2>Resumen de la reserva</h2>
            <p><strong>Titular:</strong> <span id="resumen-nombre"></span></p>
            <p><strong>Email de contacto:</strong> <span id="resumen-email"></span></p>
            <p><strong>Fecha de asistencia:</strong> <span id="resumen-fecha"></span></p>
            <p><strong>Tipo de entrada:</strong> <span id="resumen-tipo"></span></p>
            <p><strong>Número de entradas:</strong> <span id="resumen-entradas"></span></p>
            <button type="button" id="boton-modificar">Modificar reserva</button>
        </section>
    </main>
</body>
</html>
