<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reserva de entradas - Festival</title>
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <h1>Festival de música</h1>

  <section id="formulario-reserva">
    <form novalidate>
      <div class="campo">
        <label for="nombre">Nombre y apellidos</label>
        <input type="text" id="nombre">
        <div class="error" id="error-nombre"></div>
      </div>

      <div class="campo">
        <label for="email">Email</label>
        <input type="email" id="email">
        <div class="error" id="error-email"></div>
      </div>

      <div class="campo">
        <label for="entradas">Número de entradas</label>
        <input type="number" id="entradas">
        <div class="error" id="error-entradas"></div>
      </div>

      <div class="campo">
        <label for="fecha">Fecha de asistencia</label>
        <input type="text" id="fecha" placeholder="dd/mm/aaaa">
        <div class="error" id="error-fecha"></div>
      </div>

      <div class="campo">
        <label for="tipo">Tipo de entrada</label>
        <select id="tipo">
          <option value="" selected>Selecciona un tipo de entrada</option>
          <option value="general">General</option>
          <option value="premium">Premium</option>
          <option value="estudiante">Estudiante</option>
        </select>
        <div class="error" id="error-tipo"></div>
      </div>

      <div class="campo">
        <label><input type="checkbox" id="acepto"> Acepto las condiciones</label>
        <div class="error" id="error-acepto"></div>
      </div>

      <button type="submit">Confirmar reserva</button>
    </form>
  </section>

  <section id="panel-resumen">
    <h2>Resumen de la reserva</h2>
    <p><strong>Titular:</strong> <span id="rnombre"></span></p>
    <p><strong>Email:</strong> <span id="remail"></span></p>
    <p><strong>Fecha:</strong> <span id="rfecha"></span></p>
    <p><strong>Tipo de entrada:</strong> <span id="rtipo"></span></p>
    <p><strong>Entradas:</strong> <span id="rentradas"></span></p>
    <button type="button" id="modificar">Modificar reserva</button>
  </section>

  <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
